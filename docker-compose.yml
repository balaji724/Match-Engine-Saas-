version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: matchengine_db
    environment:
      POSTGRES_USER: matchengine
      POSTGRES_PASSWORD: matchengine_secret
      POSTGRES_DB: matchengine_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchengine -d matchengine_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: matchengine_redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: matchengine_api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      - DATABASE_URL=postgresql://matchengine:matchengine_secret@db:5432/matchengine_db
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: matchengine_worker
    command: celery -A backend.tasks.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      - DATABASE_URL=postgresql://matchengine:matchengine_secret@db:5432/matchengine_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: matchengine_web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
